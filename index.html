<!doctype html>
<html lang="bn">
<head>
<title>Russian Cursive Writer</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Hind+Siliguri:wght@500;600&display=swap">
<style>
/* Layout: input box on top, below it a green slanted-line notebook sheet that fills with the Cyrillic cursive version as you type */
:root {
  --paper: #b4d098;
  --paper-light: #c8deb0;
  --ink: #0f1914;
  --rule: rgba(22, 50, 26, 0.62);
  --rule-soft: rgba(22, 50, 26, 0.34);
  --note: #1f3a22;
  --btn: #1f3a22;
  --btn-fg: #e6f1d6;
  --rh: clamp(86px, 15vw, 132px);
  --fs: clamp(34px, 7.2vw, 74px);
  --script: "Marck Script", "Segoe Script", "Brush Script MT", cursive;
  --sans: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.sheet { max-width: 980px; margin: 0 auto; }
label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--note);
  margin-bottom: 6px;
}
textarea {
  width: 100%;
  min-height: 84px;
  resize: vertical;
  font: 500 18px/1.5 var(--sans);
  color: var(--ink);
  background: var(--paper-light);
  border: 1.5px solid var(--rule);
  border-radius: 4px;
  padding: 10px 12px;
}
textarea:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--note); }
.lines { position: relative; overflow: hidden; margin-top: 22px; padding-top: 8px; }
.slants {
  position: absolute;
  top: -2%; bottom: -2%; left: -20%; width: 140%;
  background: linear-gradient(to right, var(--rule) 0 1.5px, transparent 1.5px) 0 0 / 150px 100% repeat-x;
  transform: skewX(-20deg);
  pointer-events: none;
}
.row {
  position: relative;
  height: var(--rh);
  background:
    linear-gradient(var(--rule), var(--rule)) 0 76% / 100% 1.5px no-repeat,
    linear-gradient(var(--rule-soft), var(--rule-soft)) 0 34% / 100% 1px no-repeat;
}
.row span, #probe {
  font-family: var(--script);
  font-size: var(--fs);
  line-height: 1;
  white-space: nowrap;
}
.row span { position: absolute; left: 3%; bottom: 24%; color: var(--ink); }
#probe { position: absolute; visibility: hidden; left: 0; top: 0; pointer-events: none; }
.out {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-top: 18px;
}
.out output { font-size: 20px; font-weight: 600; color: var(--note); min-width: 0; overflow-wrap: anywhere; }
button {
  font: 600 14px var(--sans);
  background: var(--btn);
  color: var(--btn-fg);
  border: 0;
  border-radius: 4px;
  padding: 8px 16px;
  cursor: pointer;
}
</style>
</head>
<body>

<main class="sheet">
  <label for="src">Latin e Russian lekho</label>
  <textarea id="src" spellcheck="false" autocomplete="off">Seychas ya uzhe neplokho chitayu po-russki.</textarea>
  <p class="hint">Jemon: sh = ш, ch = ч, zh = ж, kh = х, ya = я, yu = ю, ' = ь, '' = ъ. Cyrillic likhleo cholbe.</p>

  <div class="lines" id="lines" lang="ru"><div class="slants" aria-hidden="true"></div></div>
  <span id="probe" lang="ru"></span>

  <div class="out">
    <output id="plain" lang="ru" for="src"></output>
    <button type="button" id="copy">Copy</button>
  </div>
</main>

<script>
(function () {
  var TOKENS = [
    ["shch","щ"],["sch","щ"],["yo","ё"],["yu","ю"],["ya","я"],["ye","е"],
    ["jo","ё"],["ju","ю"],["ja","я"],["je","е"],
    ["zh","ж"],["kh","х"],["ts","ц"],["ch","ч"],["sh","ш"],["''","ъ"]
  ];
  var SINGLE = {a:"а",b:"б",v:"в",g:"г",d:"д",z:"з",i:"и",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",r:"р",s:"с",t:"т",u:"у",f:"ф",h:"х",c:"ц",j:"й",w:"в",q:"к",x:"кс","'":"ь","`":"ь","’":"ь"};
  var VOWELS = "аеёиоуыэюя";

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function isLatin(ch) { return /[A-Za-z]/.test(ch); }

  function translit(s) {
    var out = "", i = 0;
    while (i < s.length) {
      var ch = s.charAt(i);
      var low = s.slice(i).toLowerCase();
      var upper = isLatin(ch) && ch !== ch.toLowerCase();
      var hit = null, len = 0, k;
      for (k = 0; k < TOKENS.length; k++) {
        if (low.indexOf(TOKENS[k][0]) === 0) { hit = TOKENS[k][1]; len = TOKENS[k][0].length; break; }
      }
      if (!hit) {
        var l = ch.toLowerCase();
        var prev = out.charAt(out.length - 1).toLowerCase();
        var prevIsVowel = VOWELS.indexOf(prev) !== -1;
        var prevIsLetter = /[а-яё]/i.test(prev);
        if (l === "e") { hit = (!prevIsLetter || prevIsVowel) ? "э" : "е"; len = 1; }
        else if (l === "y") { hit = prevIsVowel ? "й" : "ы"; len = 1; }
        else if (SINGLE[l]) { hit = SINGLE[l]; len = 1; }
      }
      if (hit) { out += upper ? cap(hit) : hit; i += len; }
      else { out += ch; i += 1; }
    }
    return out;
  }

  var src = document.getElementById("src");
  var lines = document.getElementById("lines");
  var probe = document.getElementById("probe");
  var plain = document.getElementById("plain");
  var copyBtn = document.getElementById("copy");
  var current = "";

  function width(t) { probe.textContent = t; return probe.offsetWidth; }

  function wrap(text, max) {
    var rows = [];
    text.split("\n").forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), cur = "";
      if (!words.length) { rows.push(""); return; }
      words.forEach(function (w) {
        var t = cur ? cur + " " + w : w;
        if (cur && width(t) > max) { rows.push(cur); cur = w; } else { cur = t; }
      });
      rows.push(cur);
    });
    return rows;
  }

  function render() {
    current = translit(src.value);
    plain.textContent = current;
    var max = lines.clientWidth * 0.92;
    var rows = wrap(current, max);
    while (rows.length < 4) rows.push("");
    Array.prototype.slice.call(lines.querySelectorAll(".row")).forEach(function (n) { n.remove(); });
    rows.forEach(function (r) {
      var d = document.createElement("div");
      d.className = "row";
      var s = document.createElement("span");
      s.textContent = r;
      d.appendChild(s);
      lines.appendChild(d);
    });
  }

  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Copied"; setTimeout(function () { copyBtn.textContent = "Copy"; }, 1400); }
    try {
      navigator.clipboard.writeText(current).then(done, function () {
        var r = document.createRange(); r.selectNodeContents(plain);
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      });
    } catch (e) {
      var r = document.createRange(); r.selectNodeContents(plain);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
  });

  src.addEventListener("input", render);
  window.addEventListener("resize", render);
  render();
  if (document.fonts && document.fonts.load) {
    document.fonts.load("40px 'Marck Script'", "Аа").then(render, function () {});
    document.fonts.ready.then(render);
  }
})();
</script>

</body>
</html>
